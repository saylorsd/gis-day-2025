- title: Illegal Dumping and Median Income in Minneapolis
  slug: illegal-dumping-minneapolis
  author: Zach Abelson, University of Pittsburgh
  is_student: true
  abstract: This heatmap visualizes incidents of illegal dumping across Minneapolis, Minnesota, using reports from the city’s 311 service. The map overlays this data on median household income by census tract from the American Community Survey. This reveals illegal dumping is concentrated in lower-income areas, while higher-income neighborhoods, like Downtown East, Downtown West, the North Loop and areas around the Chain of Lakes, experience significantly fewer incidents.

- title: Allegheny County Parks Brochure Map (North Park and South Park)
  slug: allegheny-parks-brochure-map
  author: Melinda Angeles, Allegheny County
  is_student: false
  abstract: In conjunction with Allegheny County's Marketing team and the Parks Department, the GIS group is updating the County's brochure maps to showcase the Parks' shelters, trails, and other amenities using the County's custom basemap.

- title: Topography and Bathymetry of Erie County
  slug: erie-topography-bathymetry
  author: Mike Baker, Erie County GIS
  is_student: false
  abstract: Map showing shaded relief of Erie County, PA including topography of the land and bathymetry of nearshore Lake Erie.

- title: Evaluating the Impact of Green Roofs on Urban Surface Temperature in Chicago’s Central Business District (August 2013 - 2024)
  slug: green-roofs-chicago
  author: Tamuna Cherkezishvili, Carnegie Mellon University
  is_student: true
  abstract: The research investigates the effect of green roofs on rooftop surface temperatures and overall vegetation coverage in Downtown Chicago between August 2013 and August 2024. Using satellite data and geospatial analysis tools in ArcGIS Pro, the research applies Normalized Difference Vegetation Index (NDVI) and Land Surface Temperature (LST) analysis to assess changes in green coverage and heat conditions over time. NDVI results show a decline in total green area despite the increase in the number and distribution of green roofs. LST analysis indicates a general rise in rooftop temperatures across all building types, with green roof buildings showing slightly lower increases and narrower temperature ranges than non-vegetated rooftops. While green roofs did not significantly cool buildings, their ability to limit extreme temperature fluctuations suggests they can play a modest but stabilizing role in climate adaptation strategies.

- title: Spatial Patterns of Objective and Perceived Measures of Age-Friendly Community
  slug: age-friendly-community
  author: Ellen Kinnee, University Center for Social and Urban Research, University of Pittsburgh
  is_student: false
  abstract: "Neighborhood environment is often characterized using secondary spatial data while qualitative research surveys provide a measure of how residents perceive their community. This study aimed to assess where objective spatial measures of the neighborhood environment, from the Allegheny County Age-Friendly Community Index (AFCI) https://afci.ucsur.pitt.edu/, and subjective survey responses from the Survey of Older Adults in Allegheny County agree and disagree. The University of Pittsburgh, University Center for Social and Urban Research (UCSUR) conducted the survey from November 2021 to May 2022 with1,299 adults aged fifty-five and older in Allegheny County, PA. The AFCI consists of tract-level percentile ranks calculated from spatial indices of built environment, transportation, housing, community services, and social participation. An Optimized Hot Spot Analysis (OHSA) run in ArcGIS Pro 6.2™ generated spatial clusters of positive and negative age-friendly measures using both spatial indicator variables and survey responses. The Hot Spot Analysis Comparison tool analyzed the similarity between OHSA outputs for matched variable pairs and visualizes geographic areas of agreement and disagreement between the two measures. Link to AFCI interactive map of Domain Rankings: https://afci.ucsur.pitt.edu/map.php"

- title: Median Age of Death of African Americans in Pittsburgh and Locations of Primary Care
  slug: african-american-median-age-of-death
  author: Christopher Linn, University of Pittsburgh
  is_student: false
  abstract: This map is designed to show the relationship between closeness to primary care location and the median age of death for black people in Pittsburgh. This relationship can show the importance of easy access to screening and routine checkups in extending life expectancy.

- title: Estimated landslide susceptibility near Ituporanga, Brazil
  slug: landslides-ituporanga
  author: Luisa Vieira Lucchese, University of Pittsburgh
  is_student: false
  abstract: >
    Susceptibility to landslides estimated by an artificial neural networks ensemble (Lucchese et al. 2025) (dataset: https://doi.org/10.5281/zenodo.7178714) over the terrain elevation and shaded relief from MERIT DEM (Yamazaki et al., 2017). Map produced using QGIS 3.44. Map printed with the support of the University of Pittsburgh.
    References:
     - Yamazaki, D., Ikeshima, D., Neal, J. C., O'Loughlin, F., Sampson, C. C., Kanae, S., & Bates, P. D. (2017, December). MERIT DEM: A new high-accuracy global digital elevation model and its merit to global hydrodynamic modeling. In AGU fall meeting abstracts (Vol. 2017, pp. H12C-04).
     - Lucchese, L. V., de Oliveira, G. G., Pedrollo, O. C., & Brenning, A. (2025). Spatially distributed antecedent rainfall thresholds for landslide occurrence: a multitask machine learning modelling approach. Hydrological Sciences Journal, (just-accepted).

- title: "Ethiopia: Farm-to-Market logistics network"
  slug: ethiopia-farm-o-market
  author: Catalina Moreno, Carnegie Mellon University
  is_student: true
  abstract: >
    This map intersects, where food is grown, where people live, and how they reach markets (roads and railway) to depict the Ethiopian logistics network, supporting ≈130 M people and a share agriculture of ≈36% of GDP. The main railway route, the Addis Ababa–Djibouti (orange corridor in the map) is the only international seaport access that move ~95% of country's external trade, including coffee , oilseeds, cut flowers, vegetables. Currently, some cities (nodes) feed this corridor, with a last main hub in the capital. As consequence we proposed the following ideas: (1) decentralized flows away from Addis by strengthening secondary hubs with cooled distribution centers and, (2) improve rural access and last-mile connectivity to reduce cost, losses and seasonality. Acknowledgment: This map was jointly produced with Luis Pachon (University of Pittsburgh) for the 2025 Global Sustainability Supply Chain Student Competition project.

- title: Milwaukee Climate Risk Mapping Tool
  slug: milkwaukee-climate-risk
  author: Aleena Siddiqui, Carnegie Mellon University
  is_student: false
  abstract: >
    This project visualizes environmental vulnerability across Milwaukee County using a multilayered GIS approach that integrates heat vulnerability, flood risk, and tree canopy coverage to identify climate risk at the census block-group level. Additional interactive layers, including FEMA floodplains, Milwaukee County Parks equity data, and transit stops, enable nuanced exploration of urban resilience factors. The tool identifies four priority regions where compounding climate hazards and socioeconomic vulnerability overlap. These insights will help guide equitable investment in green infrastructure, tree planting, and community engagement initiatives.
    ArcGIS StoryMap: https://storymaps.arcgis.com/stories/775a41e9b9d84a398f3c081055487171

- title: Environmental Hazards Surrounding Pittsburgh Regional Transit (PRT) Stops and Routes
  slug: prt-environmental-hazards
  author: AnaBeth Wentzel, University of Pittsburgh
  is_student: true
  abstract: >
    This map shows 2018-2023 data of environmental hazards in areas surrounding Pittsburgh Regional Transit stops and routes within half-mile walksheds. PRT Stops and PRT Routes are clipped within 0.5 walkable miles from PRT Stops to emphasize how PRT riders would be affected by these environmental hazards. Landslide Prone Areas, Slopes 25% Greater or Greater, and Flood Zones are not clipped to this 0.5-mile boundary to emphasize the scope of their influence. These areas are relevant when considering transportation infrastructure to avoid placing routes and stops that are in areas prone to flooding, landslides, or inaccessible due to poor walkability. PRT and City of Pittsburgh open data portals were used to produce this map.

- title: Pedestrian Crash Risk in Pittsburgh
  slug: pittsburgh-pedestrian-crash-risk
  author: Lydia Yoder, Independent / Penn State Dept of Geography
  is_student: false
  abstract: Crashes on our streets may seem random, but patterns in the data tell us otherwise. Some locations consistently see higher risks for pedestrians. This map identifies where crashes involving pedestrians are most likely to happen in Pittsburgh to help prioritize infrastructure improvements that can save lives and prevent injuries.
